name: Update news

on:
  schedule:
    # 毎時0分は GitHub 全体で混んで遅れやすいので、17分にずらす
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Python tests
        run: pytest -q

      - name: Fetch news and deals
        run: python -m fetcher

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update news.json"
            git pull --rebase
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@65

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check:links

      # vercel build は直下の requirements.txt を見て Python 用の準備（uv）を始めて落ちるので使わない。
      # ビルド済みの dist を Build Output API の形に並べて、そのまま上げる
      - name: Prepare Vercel output
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "^/(.*[^/])/?$", "dest": "/$1/index.html", "check": true },
              { "src": "/.*", "status": 404, "dest": "/404.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
