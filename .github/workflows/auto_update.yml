name: Update news

on:
  schedule:
    # 毎時0分は GitHub 全体で混んで遅れやすいので、17分にずらす
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # 実行を待っているあいだにほかの実行が news.json を push していることがあるので、
      # きっかけになったコミットではなく、取り出す時点のブランチの先頭を使う
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Python tests
        run: pytest -q

      - name: Fetch news and deals
        env:
          # 海外記事のタイトル翻訳に使う。未登録でも動き、そのときはタイトルを訳さずに出す
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python -m fetcher

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update news.json"
            # それでも news.json がぶつかったら、いま取ってきたほうを採る（rebase では theirs が手元のコミット）
            git pull --rebase -X theirs
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@65

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check:links

      # vercel build は直下の requirements.txt を見て Python 用の準備（uv）を始めて落ちるので使わない。
      # ビルド済みの dist を Build Output API の形に並べて、そのまま上げる
      - name: Prepare Vercel output
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "^/(.*[^/])/?$", "dest": "/$1/index.html", "check": true },
              { "src": "/.*", "status": 404, "dest": "/404.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Vercel で Instant Rollback をすると、それ以降の --prod デプロイは「Aliased」と表示されても
      # 本番ドメインに切り替わらなくなる（2026-11-05 にこれで本番が止まった）。
      # 本番の「最終更新」が今回のデータと一致するかを確かめ、古ければ promote して付け直す。
      - name: Verify production is updated
        env:
          PROD_URL: https://game-news-smoky.vercel.app/
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          expected=$(python -c 'import json; print(json.load(open("data/news.json"))["updated_at"])')
          check() { curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL?v=$(date +%s)" | grep -qF "datetime=\"$expected\""; }
          # 5 秒おきに最大 n 回、本番が最新になったかを見る
          wait_for_update() {
            for _ in $(seq "$1"); do
              if check; then return 0; fi
              sleep 5
            done
            return 1
          }
          # デプロイ直後は本番ドメインの切り替えが終わっていないことがあるので、すぐには promote しない
          if wait_for_update 12; then
            echo "本番は最新です ($expected)"
            exit 0
          fi
          echo "::warning::本番が古いままなので $DEPLOY_URL を promote します"
          # チームのプロジェクトなので --scope を付ける（付けないと個人アカウントを探して 404 になる）
          vercel promote "$DEPLOY_URL" --yes --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" \
            || echo "::warning::vercel promote が失敗しました"
          if wait_for_update 12; then
            echo "promote 後に本番が最新になりました ($expected)"
            exit 0
          fi
          echo "::error::本番 ($PROD_URL) が最新のデータ ($expected) になっていません"
          exit 1
