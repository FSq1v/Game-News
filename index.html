<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME FEED</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <h1 class="text-lg font-extrabold bg-gradient-to-r from-violet-400 via-fuchsia-400 to-indigo-400 bg-clip-text text-transparent tracking-wider">
          GAME FEED
        </h1>
      </div>
      <span id="update-time" class="text-[11px] font-mono text-slate-400 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800">
        更新中...
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-5">
    
    <!-- 注目新作ゲーム -->
    <section class="space-y-2">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-violet-400"></i>
          注目・期待の新作ゲーム
        </h2>
      </div>
      <div class="flex gap-3 overflow-x-auto no-scrollbar py-1" id="upcoming-container">
        <!-- JSで挿入 -->
      </div>
    </section>

    <hr class="border-slate-800/60">

    <!-- 検索 & フィルターバー -->
    <div class="flex flex-wrap gap-2 items-center">
      <!-- 検索窓 -->
      <div class="relative flex-1 min-w-[200px]">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
        <input type="text" id="search-input" oninput="renderNews()" placeholder="キーワードで絞り込み..." 
               class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-violet-500">
      </div>

      <!-- 並び替え -->
      <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1">
        <i data-lucide="arrow-up-down" class="w-3 h-3 text-slate-400"></i>
        <select id="sort-select" onchange="renderNews()" class="bg-transparent text-slate-300 text-xs focus:outline-none cursor-pointer">
          <option value="newest">新着順</option>
          <option value="oldest">古い順</option>
          <option value="title">タイトル順</option>
        </select>
      </div>

      <!-- 表示切り替え -->
      <button onclick="toggleLayout()" id="layout-btn" class="bg-slate-900 border border-slate-800 text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg flex items-center gap-1 text-xs transition">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- カテゴリタブ -->
    <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-1" id="category-bar">
      <button onclick="filterNews('all', this)" class="cat-btn bg-violet-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg whitespace-nowrap">すべて</button>
      <button onclick="filterNews('fav', this)" class="cat-btn bg-slate-900 border border-slate-800 text-amber-400 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap flex items-center gap-1">★ お気に入り</button>
      <button onclick="filterNews('jp', this)" class="cat-btn bg-slate-900 border border-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap">🇯🇵 国内速報</button>
      <button onclick="filterNews('hardware', this)" class="cat-btn bg-slate-900 border border-slate-800 text-cyan-400 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap">💻 ハード・公式</button>
      <button onclick="filterNews('global', this)" class="cat-btn bg-slate-900 border border-slate-800 text-fuchsia-400 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap">🌐 海外トレンド</button>
      <button onclick="filterNews('epic_free', this)" class="cat-btn bg-slate-900 border border-slate-800 text-emerald-400 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap">🎁 Epic無料</button>
      <button onclick="filterNews('steam_sale', this)" class="cat-btn bg-slate-900 border border-slate-800 text-sky-400 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap">🎮 Steamセール</button>
    </div>

    <!-- 記事一覧 -->
    <div id="news-container" class="grid gap-3 sm:grid-cols-2">
      <div class="col-span-full py-12 text-center text-xs text-slate-500 flex flex-col items-center gap-2">
        <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-violet-500"></i>
        <span>ニュースを読み込んでいます...</span>
      </div>
    </div>

  </main>

  <script>
    let allNews = [];
    let upcomingGames = [];
    let currentCategory = 'all';
    let favorites = JSON.parse(localStorage.getItem('game_news_favs') || '[]');
    let isCompactLayout = localStorage.getItem('game_news_layout') === 'compact';

    async function loadNews() {
      const container = document.getElementById('news-container');
      try {
        if (window.location.protocol === 'file:') {
          throw new Error("file:// 直開きでは表示できません。ローカルサーバー経由で開いてください。");
        }

        const res = await fetch('./news.json?t=' + Date.now());
        if (!res.ok) throw new Error(`HTTPエラー ${res.status}: news.json が読み込めません。`);

        const data = await res.json();
        allNews = data.articles || [];
        upcomingGames = data.upcoming_games || [];
        
        document.getElementById('update-time').innerText = `更新: ${data.updated_at || '未設定'}`;
        
        renderUpcoming();
        renderNews();
      } catch (e) {
        container.innerHTML = `
          <div class="col-span-full p-4 bg-red-950/40 border border-red-800 rounded-lg text-xs text-red-300">
            ⚠️ ${e.message}
          </div>
        `;
      }
    }

    function renderUpcoming() {
      const container = document.getElementById('upcoming-container');
      if (!upcomingGames.length) {
        container.innerHTML = `<p class="text-xs text-slate-500 py-1">予定はありません</p>`;
        return;
      }

      container.innerHTML = upcomingGames.map(g => `
        <div class="bg-slate-900 p-3 rounded-lg min-w-[220px] border border-slate-800 flex flex-col justify-between">
          <div>
            <div class="text-[10px] text-amber-400 font-bold mb-1">${g.dateText || ''}</div>
            <h3 class="font-bold text-xs text-slate-100 line-clamp-2">${g.title}</h3>
          </div>
          <div class="mt-2 text-[10px] text-slate-400 border-t border-slate-800 pt-1.5 flex gap-2">
            ${(g.links || []).map(l => `<a href="${l.url}" target="_blank" class="underline hover:text-white">${l.name}</a>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
      const sortValue = document.getElementById('sort-select').value;

      let filtered = [...allNews];

      if (currentCategory === 'fav') {
        filtered = filtered.filter(n => favorites.includes(n.id));
      } else if (currentCategory !== 'all') {
        filtered = filtered.filter(n => n.category === currentCategory);
      }

      if (searchKeyword) {
        filtered = filtered.filter(n => 
          n.title.toLowerCase().includes(searchKeyword) || 
          (n.summary && n.summary.toLowerCase().includes(searchKeyword))
        );
      }

      if (sortValue === 'newest') filtered.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      if (sortValue === 'oldest') filtered.sort((a, b) => new Date(a.pubDate) - new Date(b.pubDate));
      if (sortValue === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title, 'ja'));

      container.className = isCompactLayout ? "grid gap-2 grid-cols-1" : "grid gap-3 sm:grid-cols-2";

      if (!filtered.length) {
        container.innerHTML = `<div class="col-span-full py-8 text-center text-slate-500 text-xs">条件に該当する記事がありません</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isFav = favorites.includes(item.id);

        if (isCompactLayout) {
          return `
            <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-lg p-2.5 flex items-center justify-between gap-2 transition">
              <a href="${item.link}" target="_blank" class="flex-1 min-w-0">
                <div class="text-[9px] text-slate-400 mb-0.5">${item.category_name} • ${item.source} • ${item.pubDate}</div>
                <h2 class="font-bold text-xs text-slate-100 truncate hover:text-violet-300 transition">${item.title}</h2>
              </a>
              <button onclick="toggleFavorite('${item.id}', event)" class="p-1 text-slate-400 hover:text-amber-400 transition">
                <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>
              </button>
            </div>
          `;
        }

        return `
          <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-lg overflow-hidden flex flex-col justify-between relative group transition">
            <button onclick="toggleFavorite('${item.id}', event)" class="absolute top-2 right-2 bg-slate-950/80 p-1.5 rounded-md text-slate-400 hover:text-amber-400 transition z-10">
              <i data-lucide="star" class="w-3.5 h-3.5 ${isFav ? 'fill-amber-400 text-amber-400' : ''}"></i>
            </button>
            <a href="${item.link}" target="_blank" class="p-3.5 flex-1 flex flex-col justify-between">
              <div>
                <div class="text-[10px] text-slate-400 mb-1.5 flex items-center gap-1.5">
                  <span class="font-semibold text-slate-300">${item.category_name}</span>
                  <span>•</span>
                  <span>${item.source}</span>
                </div>
                <h2 class="font-bold text-slate-100 text-xs leading-snug mb-2 group-hover:text-violet-300 transition line-clamp-2">${item.title}</h2>
                ${item.summary ? `<p class="text-[11px] text-slate-400 line-clamp-2 bg-slate-950/60 p-2 rounded mb-2 border border-slate-800/40">${item.summary}</p>` : ''}
              </div>
              <div class="text-[10px] text-slate-500 pt-2 border-t border-slate-800/60 flex justify-between items-center">
                <span>${item.pubDate}</span>
                <i data-lucide="external-link" class="w-3 h-3 text-slate-600 group-hover:text-violet-400 transition"></i>
              </div>
            </a>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function toggleLayout() {
      isCompactLayout = !isCompactLayout;
      localStorage.setItem('game_news_layout', isCompactLayout ? 'compact' : 'grid');
      renderNews();
    }

    function toggleFavorite(id, e) {
      e.preventDefault();
      e.stopPropagation();
      favorites = favorites.includes(id) ? favorites.filter(fId => fId !== id) : [...favorites, id];
      localStorage.setItem('game_news_favs', JSON.stringify(favorites));
      renderNews();
    }

    function filterNews(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn bg-slate-900 border border-slate-800 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap';
      });
      btn.className = 'cat-btn bg-violet-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg whitespace-nowrap';
      renderNews();
    }

    loadNews();
  </script>
</body>
</html>
