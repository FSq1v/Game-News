<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME FEED | ゲーム速報・セール・新作カレンダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:active {
      transform: scale(0.98);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 selection:bg-violet-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
        <h1 class="text-lg font-extrabold tracking-wider bg-gradient-to-r from-violet-400 via-fuchsia-400 to-cyan-400 bg-clip-text text-transparent">
          GAME FEED
        </h1>
      </div>
      <span id="update-time" class="text-[11px] font-medium text-slate-400 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800">
        読み込み中...
      </span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-5 space-y-5">
    
    <!-- 今後発売・注目新作ゲーム -->
    <section class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <span>📅</span> 今後発売・注目の新作
        </h2>
        <span class="text-[10px] text-slate-500">Upcoming Games</span>
      </div>
      <div class="flex gap-3 overflow-x-auto no-scrollbar py-1" id="upcoming-container">
        <!-- JSで動的に追加されます -->
      </div>
    </section>

    <!-- 検索バー ＆ レイアウト切替 -->
    <div class="flex gap-2 items-center">
      <div class="relative flex-1">
        <input type="text" id="search-input" oninput="onSearch()" placeholder="タイトルやキーワードで検索..." 
               class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-violet-500 transition-colors pl-9">
        <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>
      </div>
      <!-- レイアウト切り替えボタン -->
      <button onclick="toggleLayout()" id="layout-btn" class="bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs p-2 rounded-xl transition-all flex items-center justify-center w-9 h-9" title="表示切り替え">
        🔲
      </button>
    </div>

    <!-- カテゴリフィルター -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="category-bar">
      <button onclick="filterNews('all', this)" class="cat-btn bg-gradient-to-r from-violet-600 to-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl whitespace-nowrap shadow-lg shadow-violet-500/20 transition-all">
        すべて
      </button>
      <button onclick="filterNews('fav', this)" class="cat-btn bg-slate-900 border border-slate-800 text-amber-300 hover:border-amber-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all flex items-center gap-1">
        ★ お気に入り
      </button>
      <button onclick="filterNews('jp', this)" class="cat-btn bg-slate-900 border border-slate-800 text-slate-300 hover:border-slate-700 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🇯🇵 国内速報
      </button>
      <button onclick="filterNews('hardware', this)" class="cat-btn bg-slate-900 border border-slate-800 text-cyan-400 hover:border-cyan-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        💻 ハード・公式
      </button>
      <button onclick="filterNews('global', this)" class="cat-btn bg-slate-900 border border-slate-800 text-fuchsia-400 hover:border-fuchsia-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🌐 海外トレンド
      </button>
      <button onclick="filterNews('epic_free', this)" class="cat-btn bg-slate-900 border border-slate-800 text-emerald-400 hover:border-emerald-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🎁 Epic無料配布
      </button>
      <button onclick="filterNews('epic_sale', this)" class="cat-btn bg-slate-900 border border-slate-800 text-teal-400 hover:border-teal-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🏷️ Epicセール
      </button>
      <button onclick="filterNews('steam_sale', this)" class="cat-btn bg-slate-900 border border-slate-800 text-sky-400 hover:border-sky-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🎮 Steamセール
      </button>
      <button onclick="filterNews('sale', this)" class="cat-btn bg-slate-900 border border-slate-800 text-amber-400 hover:border-amber-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🔥 セール速報
      </button>
    </div>

    <!-- ニュース一覧表示領域 -->
    <div id="news-container" class="grid gap-3.5 sm:grid-cols-2">
      <div class="col-span-full py-16 text-center space-y-3">
        <div class="w-8 h-8 border-2 border-violet-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs text-slate-400 font-medium">最新データを取得中...</p>
      </div>
    </div>

  </main>

  <script>
    let allNews = [];
    let currentCategory = 'all';
    let favorites = JSON.parse(localStorage.getItem('game_news_favs') || '[]');
    let isCompactLayout = localStorage.getItem('game_news_layout') === 'compact';

    // 今後発売・注目新作ゲームリスト
    const upcomingGames = [
      { title: "GTA VI (グランド・セフト・オートVI)", date: "2026年11月予定", platform: "PS5/Xbox Series", color: "from-fuchsia-500/20 to-pink-500/10" },
      { title: "STRANGER THAN HEAVEN", date: "2027年1月15日", platform: "PS5/Xbox/PC", color: "from-amber-500/20 to-orange-500/10" },
      { title: "メトロイド ラヴェナス", date: "2027年1月28日", platform: "Switch 2", color: "from-rose-500/20 to-red-500/10" },
      { title: "ペルソナ4 リバイバル", date: "2027年2月18日", platform: "PS5/Xbox/PC", color: "from-cyan-500/20 to-blue-500/10" },
      { title: "FF7 リベレーション", date: "2027年春予定", platform: "PS5/Switch 2/PC", color: "from-violet-500/20 to-purple-500/10" },
      { title: "ポケットモンスター ウインド・ウェーブ", date: "2027年予定", platform: "Switch 2", color: "from-emerald-500/20 to-teal-500/10" }
    ];

    function renderUpcoming() {
      const container = document.getElementById('upcoming-container');
      container.innerHTML = upcomingGames.map(g => `
        <div class="glass-card bg-gradient-to-br ${g.color} p-3 rounded-xl min-w-[200px] max-w-[220px] flex-shrink-0 flex flex-col justify-between border border-slate-700/50">
          <div>
            <div class="flex justify-between items-center gap-1 mb-1.5">
              <span class="text-[9px] font-extrabold bg-slate-950/80 px-2 py-0.5 rounded text-slate-300 border border-slate-800">${g.platform}</span>
              <span class="text-[10px] font-bold text-violet-300">${g.date}</span>
            </div>
            <h3 class="font-bold text-xs text-slate-100 line-clamp-2 leading-snug">${g.title}</h3>
          </div>
        </div>
      `).join('');
    }

    async function loadNews() {
      renderUpcoming();
      updateLayoutBtn();
      try {
        const res = await fetch('./news.json?t=' + new Date().getTime());
        const data = await res.json();
        allNews = data.articles || [];
        document.getElementById('update-time').innerText = `最終更新: ${data.updated_at || '未設定'}`;
        renderNews();
      } catch (e) {
        document.getElementById('news-container').innerHTML = `
          <div class="col-span-full py-12 text-center bg-slate-900/50 border border-rose-500/20 rounded-2xl p-6">
            <p class="text-sm font-semibold text-rose-400">データの読み込みに失敗しました</p>
            <p class="text-xs text-slate-500 mt-1">初回自動更新が完了するまでしばらくお待ちください。</p>
          </div>
        `;
      }
    }

    function toggleLayout() {
      isCompactLayout = !isCompactLayout;
      localStorage.setItem('game_news_layout', isCompactLayout ? 'compact' : 'grid');
      updateLayoutBtn();
      renderNews();
    }

    function updateLayoutBtn() {
      const btn = document.getElementById('layout-btn');
      btn.innerText = isCompactLayout ? '☰' : '🔲';
      btn.title = isCompactLayout ? 'グリッド表示に切り替え' : 'リスト表示に切り替え';
    }

    function toggleFavorite(id, e) {
      e.preventDefault();
      e.stopPropagation();
      if (favorites.includes(id)) {
        favorites = favorites.filter(fId => fId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('game_news_favs', JSON.stringify(favorites));
      renderNews();
    }

    function onSearch() {
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();

      let filtered = allNews;

      if (currentCategory === 'fav') {
        filtered = filtered.filter(n => favorites.includes(n.id));
      } else if (currentCategory !== 'all') {
        filtered = filtered.filter(n => n.category === currentCategory);
      }

      if (searchKeyword) {
        filtered = filtered.filter(n => 
          n.title.toLowerCase().includes(searchKeyword) || 
          (n.summary && n.summary.toLowerCase().includes(searchKeyword)) ||
          n.source.toLowerCase().includes(searchKeyword)
        );
      }

      if (isCompactLayout) {
        container.className = "grid gap-2 grid-cols-1";
      } else {
        container.className = "grid gap-3.5 sm:grid-cols-2";
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500 text-xs font-medium">
            ${currentCategory === 'fav' ? 'お気に入りに登録された記事がありません。' : '該当する記事・セールが見つかりませんでした。'}
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isFav = favorites.includes(item.id);

        if (isCompactLayout) {
          return `
            <div class="glass-card relative rounded-xl p-3 flex gap-3 items-center justify-between hover:border-violet-500/40 transition-all group">
              <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="flex-1 flex items-center gap-3 min-w-0">
                ${item.image ? `<img src="${item.image}" alt="" class="w-16 h-12 object-cover rounded-lg bg-slate-900 flex-shrink-0">` : ''}
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-[9px] font-bold px-2 py-0.2 rounded ${getTagStyle(item.category)}">${item.category_name}</span>
                    <span class="text-[9px] text-slate-400">${item.source} • ${item.pubDate}</span>
                  </div>
                  <h2 class="font-bold text-xs text-slate-100 truncate group-hover:text-violet-300 transition-colors">${item.title}</h2>
                </div>
              </a>
              <button onclick="toggleFavorite('${item.id}', event)" class="text-xs p-1 text-slate-400 hover:text-amber-400 transition-colors">
                ${isFav ? '★' : '☆'}
              </button>
            </div>
          `;
        }

        return `
        <div class="glass-card relative rounded-2xl overflow-hidden transition-all duration-200 hover:border-violet-500/40 hover:shadow-xl hover:shadow-violet-500/5 group flex flex-col justify-between">
          
          <button onclick="toggleFavorite('${item.id}', event)" class="absolute top-2.5 right-2.5 z-20 bg-slate-950/70 backdrop-blur-md border border-slate-700/60 text-xs p-1.5 rounded-full hover:scale-110 transition-transform">
            ${isFav ? '★' : '☆'}
          </button>

          <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="block h-full flex flex-col justify-between">
            ${item.image ? `
              <div class="w-full h-36 overflow-hidden relative bg-slate-900">
                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                
                ${item.badge ? `
                  <span class="absolute top-2.5 left-2.5 z-10 bg-rose-600 text-white font-extrabold text-[10px] px-2 py-0.5 rounded-md shadow-lg tracking-wider">
                    ${item.badge}
                  </span>
                ` : ''}
              </div>
            ` : ''}

            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2.5 pr-6">
                  <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-md tracking-wider ${getTagStyle(item.category)}">
                    ${item.category_name}
                  </span>
                  <span class="text-[10px] text-slate-400 font-medium flex items-center gap-1">
                    <span class="text-slate-300 font-semibold">${item.source}</span>
                  </span>
                </div>

                <h2 class="font-bold text-slate-100 text-sm leading-snug mb-2 group-hover:text-violet-300 transition-colors line-clamp-2">
                  ${item.title}
                </h2>

                ${item.summary ? `
                  <p class="text-xs text-slate-400 leading-relaxed line-clamp-2 mb-3 bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/50">
                    ${item.summary}
                  </p>
                ` : ''}
              </div>

              <div class="flex items-center justify-between text-[10px] font-medium text-slate-400 pt-2 border-t border-slate-800/40 mt-2">
                <span>${item.pubDate}</span>
                ${item.expire ? `<span class="text-amber-400 font-bold bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">⏰ ${item.expire}</span>` : ''}
              </div>
            </div>
          </a>

        </div>
      `}).join('');
    }

    function getTagStyle(cat) {
      if (cat === 'epic_free') return 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 animate-pulse';
      if (cat === 'epic_sale') return 'bg-teal-500/10 text-teal-300 border border-teal-500/30';
      if (cat === 'steam_sale') return 'bg-sky-500/20 text-sky-300 border border-sky-500/40';
      if (cat === 'sale') return 'bg-amber-500/10 text-amber-400 border border-amber-500/30';
      if (cat === 'jp') return 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/30';
      if (cat === 'hardware') return 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/30';
      return 'bg-fuchsia-500/10 text-fuchsia-300 border border-fuchsia-500/30';
    }

    function filterNews(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn bg-slate-900 border border-slate-800 text-slate-300 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all hover:border-slate-700';
      });

      btn.className = 'cat-btn bg-gradient-to-r from-violet-600 to-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl whitespace-nowrap shadow-lg shadow-violet-500/20 transition-all';

      renderNews();
    }

    loadNews();
  </script>
</body>
</html>
