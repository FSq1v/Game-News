<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME FEED | ゲーム速報・トレンドポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:active {
      transform: scale(0.98);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 selection:bg-violet-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
        <h1 class="text-lg font-extrabold tracking-wider bg-gradient-to-r from-violet-400 via-fuchsia-400 to-cyan-400 bg-clip-text text-transparent">
          GAME FEED
        </h1>
      </div>
      <span id="update-time" class="text-[11px] font-medium text-slate-400 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800">
        読み込み中...
      </span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-5 space-y-5">
    
    <!-- カテゴリフィルター（横スクロール） -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="category-bar">
      <button onclick="filterNews('all', this)" class="cat-btn bg-gradient-to-r from-violet-600 to-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl whitespace-nowrap shadow-lg shadow-violet-500/20 transition-all">
        すべて
      </button>
      <button onclick="filterNews('sale', this)" class="cat-btn bg-slate-900 border border-slate-800 text-amber-400 hover:border-amber-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🔥 セール・お得
      </button>
      <button onclick="filterNews('jp', this)" class="cat-btn bg-slate-900 border border-slate-800 text-slate-300 hover:border-slate-700 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🇯🇵 国内速報
      </button>
      <button onclick="filterNews('hardware', this)" class="cat-btn bg-slate-900 border border-slate-800 text-cyan-400 hover:border-cyan-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        💻 ハード・公式
      </button>
      <button onclick="filterNews('global', this)" class="cat-btn bg-slate-900 border border-slate-800 text-fuchsia-400 hover:border-fuchsia-500/50 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all">
        🌐 海外トレンド
      </button>
    </div>

    <!-- ニュース一覧表示領域 -->
    <div id="news-container" class="grid gap-3.5 sm:grid-cols-2">
      <div class="col-span-full py-16 text-center space-y-3">
        <div class="w-8 h-8 border-2 border-violet-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs text-slate-400 font-medium">最新ニュースを取得中...</p>
      </div>
    </div>

  </main>

  <script>
    let allNews = [];

    async function loadNews() {
      try {
        const res = await fetch('./news.json?t=' + new Date().getTime());
        const data = await res.json();
        allNews = data.articles || [];
        document.getElementById('update-time').innerText = `最終更新: ${data.updated_at || '未設定'}`;
        renderNews(allNews);
      } catch (e) {
        document.getElementById('news-container').innerHTML = `
          <div class="col-span-full py-12 text-center bg-slate-900/50 border border-rose-500/20 rounded-2xl p-6">
            <p class="text-sm font-semibold text-rose-400">データの読み込みに失敗しました</p>
            <p class="text-xs text-slate-500 mt-1">初回自動更新が完了するまでしばらくお待ちください。</p>
          </div>
        `;
      }
    }

    function renderNews(articles) {
      const container = document.getElementById('news-container');
      if (articles.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500 text-xs font-medium">
            該当するニュースが見つかりませんでした。
          </div>
        `;
        return;
      }

      container.innerHTML = articles.map(item => `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
           class="glass-card block rounded-2xl p-4 transition-all duration-200 hover:border-violet-500/40 hover:shadow-xl hover:shadow-violet-500/5 group flex flex-col justify-between">
          
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-md tracking-wider ${getTagStyle(item.category)}">
                ${item.category_name}
              </span>
              <span class="text-[10px] text-slate-400 font-medium flex items-center gap-1">
                <span class="text-slate-300 font-semibold">${item.source}</span>
                <span>•</span>
                <span>${item.pubDate}</span>
              </span>
            </div>

            <h2 class="font-bold text-slate-100 text-sm leading-snug mb-2 group-hover:text-violet-300 transition-colors line-clamp-2">
              ${item.title}
            </h2>

            ${item.summary ? `
              <p class="text-xs text-slate-400 leading-relaxed line-clamp-2 mb-3 bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/50">
                ${item.summary}
              </p>
            ` : ''}
          </div>

          <div class="flex items-center justify-end text-[11px] font-semibold text-violet-400 group-hover:translate-x-0.5 transition-transform">
            記事を読む <span class="ml-1">→</span>
          </div>

        </a>
      `).join('');
    }

    function getTagStyle(cat) {
      if (cat === 'sale') return 'bg-amber-500/10 text-amber-400 border border-amber-500/30';
      if (cat === 'jp') return 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/30';
      if (cat === 'hardware') return 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/30';
      return 'bg-fuchsia-500/10 text-fuchsia-300 border border-fuchsia-500/30';
    }

    function filterNews(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn bg-slate-900 border border-slate-800 text-slate-300 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all hover:border-slate-700';
      });

      btn.className = 'cat-btn bg-gradient-to-r from-violet-600 to-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl whitespace-nowrap shadow-lg shadow-violet-500/20 transition-all';

      if (category === 'all') {
        renderNews(allNews);
      } else {
        renderNews(allNews.filter(n => n.category === category));
      }
    }

    loadNews();
  </script>
</body>
</html>
