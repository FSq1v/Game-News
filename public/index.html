<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAME FEED | ゲームニュースとセール情報</title>
  <meta name="description" content="国内外のゲームニュースと、Steam・Epic・PS Store・Nintendo eShop のセール情報を1時間ごとに自動でまとめています。">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="./">GAME FEED</a>
      <input type="search" id="search" class="search" placeholder="タイトル・出典・ストアで検索" aria-label="ニュースとセールを検索">
      <p class="status" id="status" aria-live="polite">読み込み中</p>
    </div>
    <nav class="view-tabs" aria-label="表示の切り替え">
      <button type="button" class="view-tab" data-view="news" aria-pressed="true">ニュース</button>
      <button type="button" class="view-tab" data-view="deals" aria-pressed="false">セール</button>
    </nav>
  </header>

  <section class="hero reveal">
    <h1 class="hero__title">ゲームの今を、ひと目で。</h1>
    <p class="hero__lead">国内外のゲームニュースと、Steam・Epic・PS Store・Nintendo eShop のセール情報。1時間ごとに、まとめてお届けします。</p>
  </section>

  <main class="layout" data-view="news">
    <section class="news" aria-labelledby="news-heading">
      <div class="section-head reveal">
        <h2 id="news-heading">ニュース</h2>
      </div>
      <div class="chips reveal" role="group" aria-label="ニュースの絞り込み" id="news-filters">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" class="chip" data-filter="jp" aria-pressed="false">国内</button>
        <button type="button" class="chip" data-filter="global" aria-pressed="false">海外</button>
        <button type="button" class="chip" data-filter="official" aria-pressed="false">公式</button>
        <button type="button" class="chip" data-filter="fav" aria-pressed="false">お気に入り</button>
      </div>
      <ol class="news-list" id="news-list"></ol>
      <p class="empty" id="news-empty" hidden></p>
    </section>

    <aside class="deals" aria-labelledby="deals-heading">
      <div class="section-head reveal">
        <h2 id="deals-heading">セールと無料配布</h2>
        <label class="sort">
          <span class="visually-hidden">並べ替え</span>
          <select id="deal-sort">
            <option value="default">おすすめ順</option>
            <option value="discount">割引率が高い順</option>
            <option value="ending">終了が近い順</option>
            <option value="price">安い順</option>
          </select>
        </label>
      </div>
      <div class="chips reveal" role="group" aria-label="ストアの絞り込み" id="store-filters">
        <button type="button" class="chip" data-store="all" aria-pressed="true">すべて</button>
        <button type="button" class="chip chip--steam" data-store="steam" aria-pressed="false">Steam</button>
        <button type="button" class="chip chip--epic" data-store="epic" aria-pressed="false">Epic</button>
        <button type="button" class="chip chip--ps" data-store="ps" aria-pressed="false">PS Store</button>
        <button type="button" class="chip chip--eshop" data-store="eshop" aria-pressed="false">Switch</button>
      </div>
      <div class="free" id="free"></div>
      <ol class="deal-list" id="deal-list"></ol>
      <p class="empty" id="deals-empty" hidden></p>
    </aside>
  </main>

  <footer class="site-footer reveal">
    <p>ニュースは各メディアの RSS、セールは各ストアの公開データから1時間ごとに自動で集めています。価格や期間は各ストアのページで確認してください。</p>
  </footer>

  <template id="news-item">
    <li class="news-item">
      <a class="news-item__link" target="_blank" rel="noopener noreferrer">
        <span class="thumb"><img alt="" loading="lazy" decoding="async"></span>
        <span class="news-item__body">
          <span class="news-item__title"></span>
          <span class="news-item__meta"><span class="news-item__source"></span><time></time><span class="badge" hidden>翻訳</span></span>
        </span>
      </a>
      <button type="button" class="fav" aria-pressed="false"><span class="visually-hidden">お気に入り</span></button>
    </li>
  </template>

  <template id="deal-item">
    <li class="deal">
      <a class="deal__link" target="_blank" rel="noopener noreferrer">
        <span class="thumb thumb--deal"><img alt="" loading="lazy" decoding="async"></span>
        <span class="deal__body">
          <span class="deal__title"></span>
          <span class="deal__meta"><span class="store-mark"></span><span class="deal__ends"></span></span>
        </span>
        <span class="tag"><span class="tag__off"></span><span class="tag__price"></span><s class="tag__was"></s></span>
      </a>
    </li>
  </template>

  <template id="free-item">
    <a class="free-card" target="_blank" rel="noopener noreferrer">
      <img alt="" loading="lazy" decoding="async">
      <span class="free-card__body">
        <span class="free-card__label"></span>
        <span class="free-card__title"></span>
        <span class="free-card__when"></span>
      </span>
    </a>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
